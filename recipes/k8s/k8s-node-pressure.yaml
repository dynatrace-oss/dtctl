# Source: dt-obs-kubernetes/SKILL.md (node capacity, requests/limits
# aggregation rule) and references/workload-health.md (Node Conditions)
apiVersion: dtctl.dev/v1alpha1
kind: Recipe
metadata:
  name: k8s-node-pressure
  version: 1
  tags: [k8s, nodes, capacity, requests, memory, cpu, pressure, scheduling]
spec:
  summary: Kubernetes nodes near their allocatable CPU/memory, or reporting a pressure condition
  description: >-
    Why pods stay Pending or get evicted: per node, the CPU and memory that
    containers request and use as a share of what the node can allocate, plus
    any MemoryPressure/DiskPressure/PIDPressure or not-Ready condition seen in
    the window.
  requires: [k8s-metrics]
  timeframe: 30m
  scope: [cluster, tag]
  params:
    threshold:
      type: int
      default: 80
      min: 1
      max: 100
  dql: |
    timeseries { cpu_alloc = sum(dt.kubernetes.node.cpu_allocatable),
                 mem_alloc = sum(dt.kubernetes.node.memory_allocatable),
                 cpu_req = sum(dt.kubernetes.container.requests_cpu),
                 mem_req = sum(dt.kubernetes.container.requests_memory),
                 cpu_use = sum(dt.kubernetes.container.cpu_usage),
                 mem_use = sum(dt.kubernetes.container.memory_working_set) },
      by: {k8s.cluster.name, k8s.node.name}, union: true
      {{- with .scope.expr}}, filter: {{.}}{{end}}
    | fieldsAdd live = if(iIndex() >= arraySize(cpu_alloc) - 3 and isNotNull(cpu_alloc[]), 1, else: 0)
    | filter arraySum(live) > 0
    | fieldsAdd cpu_alloc = arrayAvg(cpu_alloc), mem_alloc = arrayAvg(mem_alloc)
    | filter cpu_alloc > 0 and mem_alloc > 0
    | fieldsAdd cpu_requested_pct = round(100 * arrayAvg(cpu_req) / cpu_alloc, decimals: 1),
        mem_requested_pct = round(100 * arrayAvg(mem_req) / mem_alloc, decimals: 1),
        cpu_used_pct = round(100 * arrayAvg(cpu_use) / cpu_alloc, decimals: 1),
        mem_used_pct = round(100 * arrayAvg(mem_use) / mem_alloc, decimals: 1),
        cpu_allocatable_cores = round(cpu_alloc / 1000, decimals: 2),
        mem_allocatable_gib = round(mem_alloc / 1073741824, decimals: 1)
    | fieldsAdd key = concat(k8s.cluster.name, "|", k8s.node.name)
    | lookup [
        timeseries c = max(dt.kubernetes.node.conditions),
          by: {k8s.cluster.name, k8s.node.name, node_condition, condition_status},
          filter: in(node_condition, {"Ready", "MemoryPressure", "DiskPressure", "PIDPressure"})
          {{- with .scope.expr}} and {{.}}{{end}}
        | fieldsAdd status = lower(toString(condition_status)),
            now = if(iIndex() >= arraySize(c) - 3 and isNotNull(c[]), 1, else: 0)
        | filter arraySum(now) > 0
          and ((node_condition == "Ready" and status != "true")
            or (node_condition != "Ready" and status == "true"))
        | fieldsAdd condition = if(node_condition == "Ready", concat("NotReady(", status, ")"),
            else: node_condition)
        | summarize conditions = collectDistinct(condition), by: {k8s.cluster.name, k8s.node.name}
        | fieldsAdd key = concat(k8s.cluster.name, "|", k8s.node.name)
      ], sourceField: key, lookupField: key, fields: {conditions}
    | fieldsAdd peak_pct = arrayMax(array(cpu_requested_pct, mem_requested_pct, cpu_used_pct, mem_used_pct))
    | filter peak_pct >= {{.threshold}} or isNotNull(conditions)
    | fields k8s.cluster.name, k8s.node.name, conditions, cpu_requested_pct, mem_requested_pct,
        cpu_used_pct, mem_used_pct, cpu_allocatable_cores, mem_allocatable_gib, peak_pct
    | sort isNotNull(conditions) desc, peak_pct desc
    | limit 50
  means: >-
    One row per node, averaged over the window. *_requested_pct is the sum of
    container requests on the node as a percentage of the node's allocatable
    capacity: the scheduler places a pod only if its requests fit, so a node
    near 100% requested refuses new pods even when it is idle. *_used_pct is
    actual usage (CPU in millicores, memory working set) against the same
    allocatable; memory used above 100% of requested is what gets pods evicted
    or OOM-killed. Requests can exceed 100% briefly while terminated pods are
    still counted. conditions lists MemoryPressure, DiskPressure, PIDPressure
    or NotReady(false|unknown) in force at the end of the window (the last
    three intervals); such nodes sort first. Nodes that stopped reporting
    before the end of the window (scaled down, deleted) are left out. Units:
    percent, cores, GiB. Decision rule: requested near 100% blocks scheduling,
    used near or above 100% of requested evicts and kills; a pressure
    condition is acted on by the kubelet already. Not shown: which pods use
    the capacity, and pods that failed to schedule (k8s-warning-events,
    FailedScheduling).
  emptyMeans: >-
    No node reached the threshold on requested or used CPU/memory and none
    reports a pressure or not-Ready condition at the end of the window. Nodes whose
    cluster runs without Dynatrace Kubernetes metrics are absent, not healthy;
    a misspelled --cluster (exact, case-sensitive) gives the same empty
    result. Check names with `dtctl run k8s-clusters`, or lower --threshold.
  next:
    - recipe: k8s-warning-events
      when: nonempty
      bind: { cluster: k8s.cluster.name }
    - recipe: k8s-clusters
      when: empty
