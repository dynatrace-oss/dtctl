# Source: dt-obs-tracing/references/performance-analysis.md (exemplar pattern from dt-obs-tracing/SKILL.md)
apiVersion: dtctl.dev/v1alpha1
kind: Recipe
metadata:
  name: traces-slow-endpoints
  version: 3
  tags: [traces, latency, endpoints, slow, p99]
spec:
  summary: Slowest endpoints across services by p99 root-span duration, with the slowest trace each
  description: >-
    Ranks endpoints of all services (or one) by tail latency and hands over the
    slowest trace of each. For one service's full endpoint profile use
    services-latency.
  requires: [spans]
  # Inline: the baseline is a second fetch of the same window shifted back, so
  # the DQL writes both windows itself.
  timeframe: { default: 1h, max: 1d, inline: true }
  scope: [cluster, namespace, tag]
  params:
    service:
      type: string
      positional: true
      description: Only this service (exact dt.service.name, see services-list)
    min_requests:
      type: int
      default: 10
      min: 1
      description: Skip endpoints with fewer requests in the window (their p99 is noise)
    baseline:
      type: enum
      values: [day, week, none]
      default: day
      description: Compare with the same window a day or a week earlier (none skips the second scan)
  dql: |
    {{- define "slow-endpoint-spans"}}
    {{- with .scope.stage}}
    {{.}}{{end}}
    | filter request.is_root_span == true
    {{- if .service}}
    | filter dt.service.name == {{.service}}{{end}}
    | fields dt.service.name, endpoint.name, duration, trace.id,
        multiplicity = {{template "span-multiplicity"}}
    {{- end}}
    {{- $shift := "-24h"}}{{if eq .baseline "week"}}{{$shift = "-168h"}}{{end}}
    fetch spans, from: {{.window.from}}, to: {{.window.to}}
    {{- template "slow-endpoint-spans" .}}
    {{- if ne .baseline "none"}}
    | fieldsAdd base = false
    | append [fetch spans, from: {{timeAdd .window.from $shift}}, to: {{timeAdd .window.to $shift}}
    {{- template "slow-endpoint-spans" .}}
        | fieldsAdd base = true]
    | summarize { requests = toLong(round(sum(if(not(base), multiplicity, else: 0)))),
                  p50 = percentile(if(not(base), duration), 50),
                  p99 = percentile(if(not(base), duration), 99),
                  max = max(if(not(base), duration)),
                  slowest = takeMax(if(not(base), record(duration, trace.id))),
                  base_requests = toLong(round(sum(if(base, multiplicity, else: 0)))),
                  base_p99 = percentile(if(base, duration), 99) },
        by: {dt.service.name, endpoint.name}
    {{- else}}
    | summarize { requests = toLong(round(sum(multiplicity))),
                  p50 = percentile(duration, 50), p99 = percentile(duration, 99),
                  max = max(duration), slowest = takeMax(record(duration, trace.id)) },
        by: {dt.service.name, endpoint.name}
    {{- end}}
    | filter requests >= {{.min_requests}}
    | fields dt.service.name, endpoint.name, requests,
        p50_ms = round(p50 / 1ms, decimals: 1), p99_ms = round(p99 / 1ms, decimals: 1),
        max_ms = round(max / 1ms, decimals: 1),
    {{- if ne .baseline "none"}}
        base_p99_ms = round(base_p99 / 1ms, decimals: 1), base_requests,
        p99_vs_base = round(toDouble(p99) / toDouble(base_p99), decimals: 2),
    {{- end}}
        slowest_trace_id = slowest[trace.id]
    | sort p99_ms desc
    | limit 15
  means: >-
    Endpoints ranked by the 99th percentile duration of their request root
    spans, in milliseconds; percentiles are approximate (p99 can come out
    slightly above max_ms). requests is extrapolated from sampled spans and
    approximates real traffic; endpoints below --min-requests are left out.
    base_p99_ms and base_requests are the same endpoint in the same window a
    day (or with --baseline week, a week) earlier, and p99_vs_base their
    ratio. Decide with the ratio, not the rank: near 1 means the endpoint is
    always this slow (streaming, websockets, long polling and batch jobs rank
    first by design), well above 1 is a regression, and a null baseline is an
    endpoint with no traffic back then (new, or renamed). slowest_trace_id is
    the slowest stored trace of that endpoint; open it with traces-get.
    Capped at 15 endpoints. Not shown: why it is slow (traces-get on the
    slowest trace) or slow non-root spans such as database calls.
  emptyMeans: >-
    No endpoint had --min-requests request root spans in the window. If you
    named a service, check the name first: dt.service.name is exact and
    case-sensitive (`dtctl run services-list <fragment>`). Otherwise the
    service is not traced (no OneAgent or OpenTelemetry spans), the traffic is
    too low for the window, or --min-requests is too high.
  next:
    - recipe: services-list
      when: empty
      with: { contains: "{{.service}}" }
    - recipe: traces-get
      bind: { trace_id: slowest_trace_id }
    - recipe: services-latency
      bind: { service: dt.service.name }
