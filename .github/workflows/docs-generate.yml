name: Docs - Generated Reference Freshness

on:
  pull_request:
    paths:
      - 'cmd/**'
      - 'pkg/**'
      - 'scripts/gen-docs/**'
      - 'docs/resources/**'
      - 'docs/COMMANDS.md'
      - 'docs/TOKEN_SCOPES.md'
      - 'makefile'
      - '.github/workflows/docs-generate.yml'
  push:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'pkg/**'
      - 'scripts/gen-docs/**'
      - 'docs/resources/**'
      - 'docs/COMMANDS.md'
      - 'docs/TOKEN_SCOPES.md'
      - 'makefile'
      - '.github/workflows/docs-generate.yml'

jobs:
  check-generated-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate reference docs
        run: make docs-generate

      - name: Fail if generated docs are stale
        run: |
          if ! git diff --exit-code -- docs/resources docs/COMMANDS.md docs/TOKEN_SCOPES.md docs/INDEX.md; then
            echo ""
            echo "❌ Generated reference docs are out of date."
            echo ""
            echo "📌 Solution: run 'make docs-generate' locally and commit the result:"
            echo ""
            echo "   make docs-generate"
            echo "   git add docs/resources docs/COMMANDS.md docs/TOKEN_SCOPES.md docs/INDEX.md"
            echo "   git commit"
            exit 1
          fi
          echo "✅ Generated reference docs are up to date."
