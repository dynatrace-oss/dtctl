---
name: Linting

on:
  pull_request:
  workflow_dispatch:

# No job here writes to the repo, so the default token stays read-only.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Markdown
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - name: MarkdownLint-Cli
        run: make markdownlint
