---
name: Linting

on:
  pull_request:
  workflow_dispatch:

# No job here writes to the repo, so the default token stays read-only.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Markdown
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: MarkdownLint-Cli
        run: make markdownlint
