name: Sign Test (temporary)

# TEMPORARY — ASDY-29538. End-to-end proof of the release.yml signing path from
# this branch: same build -> sign -> GoReleaser jobs, but GoReleaser runs as a
# snapshot and nothing is published. Removed again before the PR merges.

on:
  push:
    branches:
      - ci/sign-windows-binaries
    paths:
      - .github/workflows/sign-test.yml

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      current_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve the last release tag
        id: tag
        run: echo "tag=$(git describe --tags --abbrev=0 --exclude 'sdk/*')" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Build with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: build --snapshot --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.tag }}

      - name: Stage unsigned Windows executables
        run: |
          set -euo pipefail
          mkdir -p unsigned/amd64 unsigned/arm64
          cp dist/dtctl_windows_amd64*/dtctl.exe unsigned/amd64/dtctl.exe
          cp dist/dtctl_windows_arm64*/dtctl.exe unsigned/arm64/dtctl.exe
          sha256sum unsigned/*/dtctl.exe

      - name: Upload unsigned Windows amd64 executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-windows-amd64
          path: unsigned/amd64/dtctl.exe
          if-no-files-found: error
          retention-days: 1

      - name: Upload unsigned Windows arm64 executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-windows-arm64
          path: unsigned/arm64/dtctl.exe
          if-no-files-found: error
          retention-days: 1

  sign-windows-amd64:
    name: Sign Windows amd64
    needs: build
    permissions:
      contents: read
      id-token: write
    # Pinned to the dt-sign-service-actions main commit that v1 will be moved to.
    uses: Dynatrace/dt-sign-service-actions/.github/workflows/sign-windows.yml@8f95234398c5bd1c661537f5cf0cb0f5415967ff
    with:
      unsigned-artifact-name: unsigned-windows-amd64
      file-to-sign: dtctl.exe
      signed-artifact-name: signed-windows-amd64
    secrets:
      SIGNING_GCP_PROJECT_ID: ${{ secrets.SIGNING_GCP_PROJECT_ID }}
      SIGNING_GCP_KMS_LOCATION: ${{ secrets.SIGNING_GCP_KMS_LOCATION }}
      SIGNING_GCP_KMS_KEYRING: ${{ secrets.SIGNING_GCP_KMS_KEYRING }}
      SIGNING_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.SIGNING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
      SIGNING_GCP_SERVICE_ACCOUNT: ${{ secrets.SIGNING_GCP_SERVICE_ACCOUNT }}
      SIGNING_GCP_KMS_KEY: ${{ secrets.SIGNING_GCP_KMS_KEY_AUTHENTICODE }}
      SIGNING_CODE_SIGNING_CERT: ${{ secrets.SIGNING_CODE_SIGNING_CERT_AUTHENTICODE }}

  sign-windows-arm64:
    name: Sign Windows arm64
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: Dynatrace/dt-sign-service-actions/.github/workflows/sign-windows.yml@8f95234398c5bd1c661537f5cf0cb0f5415967ff
    with:
      unsigned-artifact-name: unsigned-windows-arm64
      file-to-sign: dtctl.exe
      signed-artifact-name: signed-windows-arm64
    secrets:
      SIGNING_GCP_PROJECT_ID: ${{ secrets.SIGNING_GCP_PROJECT_ID }}
      SIGNING_GCP_KMS_LOCATION: ${{ secrets.SIGNING_GCP_KMS_LOCATION }}
      SIGNING_GCP_KMS_KEYRING: ${{ secrets.SIGNING_GCP_KMS_KEYRING }}
      SIGNING_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.SIGNING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
      SIGNING_GCP_SERVICE_ACCOUNT: ${{ secrets.SIGNING_GCP_SERVICE_ACCOUNT }}
      SIGNING_GCP_KMS_KEY: ${{ secrets.SIGNING_GCP_KMS_KEY_AUTHENTICODE }}
      SIGNING_CODE_SIGNING_CERT: ${{ secrets.SIGNING_CODE_SIGNING_CERT_AUTHENTICODE }}

  goreleaser:
    name: GoReleaser (snapshot)
    needs: [build, sign-windows-amd64, sign-windows-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # cosign keyless, exactly as in the release
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download signed Windows amd64 executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-windows-amd64
          path: ${{ runner.temp }}/signed/amd64

      - name: Download signed Windows arm64 executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-windows-arm64
          path: ${{ runner.temp }}/signed/arm64

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Run GoReleaser (snapshot, nothing is published)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --snapshot --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ needs.build.outputs.current_tag }}
          HOMEBREW_TAP_GITHUB_TOKEN: not-used-in-snapshot
          SIGNED_WINDOWS_DIR: ${{ runner.temp }}/signed

      - name: Verify the zips carry the signed executables
        env:
          SIGNED: ${{ runner.temp }}/signed
        run: |
          set -euo pipefail
          cd dist
          for a in amd64 arm64; do
            zip=$(ls dtctl_*_windows_${a}.zip)
            unzip -q -o "$zip" dtctl.exe -d "x_$a"
            want=$(sha256sum "$SIGNED/$a/dtctl.exe" | cut -d' ' -f1)
            got=$(sha256sum "x_$a/dtctl.exe" | cut -d' ' -f1)
            [ "$want" = "$got" ] || { echo "::error::$zip does not contain the signed dtctl.exe"; exit 1; }
            echo "$zip contains the signed dtctl.exe ($got)"
            ls "$zip".sbom.json
          done

      - name: Verify checksums.txt and its cosign bundle
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c --ignore-missing checksums.txt
          grep -c . checksums.txt
          cosign verify-blob checksums.txt \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/sign-test.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Upload snapshot dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-dist
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sbom.json
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
          if-no-files-found: error
          retention-days: 3

  verify-authenticode:
    name: Verify Authenticode
    needs: goreleaser
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Download snapshot dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snapshot-dist
          path: dist

      - name: Verify both executables inside the release zips
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          foreach ($a in 'amd64', 'arm64') {
            $zip = Get-ChildItem "dist\dtctl_*_windows_$a.zip"
            Expand-Archive $zip.FullName -DestinationPath "x_$a" -Force
            $exe = "x_$a\dtctl.exe"
            & $signtool.FullName verify /pa /v $exe
            if ($LASTEXITCODE -ne 0) { throw "signtool verify /pa failed for $($zip.Name)" }
            $sig = Get-AuthenticodeSignature $exe
            Write-Host "$($zip.Name): status=$($sig.Status) signer=$($sig.SignerCertificate.Subject)"
            Write-Host "  issuer=$($sig.SignerCertificate.Issuer)"
            Write-Host "  thumbprint=$($sig.SignerCertificate.Thumbprint) timestamped=$($null -ne $sig.TimeStamperCertificate)"
            if ($sig.Status -ne 'Valid') { throw "$($zip.Name): signature status $($sig.Status)" }
            if ($sig.SignerCertificate.Subject -notmatch 'O=Dynatrace LLC') { throw "$($zip.Name): unexpected signer" }
            if ($null -eq $sig.TimeStamperCertificate) { throw "$($zip.Name): signature is not timestamped" }
          }
