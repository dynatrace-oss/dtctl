name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No job here writes to the repo, so the default token stays read-only.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.6'

      - name: Check goimports formatting
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.50.0
          goimports_output=$(goimports -local github.com/dynatrace-oss -l .)
          if [ -n "$goimports_output" ]; then
            echo "The following files are not properly formatted:"
            echo "$goimports_output"
            echo ""
            echo "Run 'make fmt' to fix formatting."
            exit 1
          fi

      - name: Check go mod tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo ""
            echo "go.mod or go.sum is not tidy. Run 'go mod tidy' and commit the changes."
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.11.1

