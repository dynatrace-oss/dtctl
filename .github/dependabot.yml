version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    labels:
      - deps
      - cli
  - package-ecosystem: gomod
    directory: /sdk
    schedule:
      interval: weekly
    labels:
      - deps
      - sdk
  # Actions are pinned by commit SHA, which nothing updates by hand -- without
  # this entry the pins silently rot. Dependabot rewrites both the SHA and the
  # trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
