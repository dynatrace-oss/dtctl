# Illustrative only: a recipe bundle as an AI-observability app could ship it
# (RECIPES_DESIGN.md §13). The app stores it as one document of type
# `ai-agent-resource` named `recipes/<name>.yaml`; dtctl reads it from the
# Document store of the current context. The app's identity comes from the
# document's originAppId, which is why this file names no app.
#
# Source: dt-obs-genai/SKILL.md (Agent Signals, Evaluation Quality, Empty-State Check)
apiVersion: dtctl.dev/v1alpha1
kind: RecipeBundle
metadata:
  name: genai
  version: 7                       # bundle content version, bumped by the app's release
  minDtctlVersion: 0.44.0          # older dtctl skips the bundle with a note
spec:
  # New domains only. Recipes may also use built-in domains (`genai` is one),
  # but a bundle cannot re-describe a built-in domain.
  domains: {}

  # Same shape as `dtctl inventory --definitions`. A bundle may add capability
  # names; it may not redefine a built-in or another bundle's capability.
  # Probes are evaluated only by an explicit `dtctl inventory`, so these stay
  # `unknown` (and their recipes stay listed) until one has run.
  capabilities:
    genai:
      probe: 'fetch spans, from:now()-24h, samplingRatio:100 | filter isNotNull(gen_ai.request.model) | limit 1'
      window: 24h
    genai-evaluations:
      probe: 'fetch bizevents, from:now()-7d | filter event.type == "gen_ai.evaluation.result" | limit 1'
      window: 7d

  recipes:
    - metadata:
        name: genai-presence
        version: 1
        tags: [genai, llm, onboarding]
      spec:
        summary: Which GenAI signal families this environment's spans carry
        requires: [spans]          # deliberately not `genai`: this is the check for it
        timeframe: 24h
        scope: [cluster, namespace, tag]
        dql: |
          fetch spans
          {{- with .scope.stage}}
          {{.}}{{end}}
          | summarize has_genai = countIf(isNotNull(gen_ai.request.model)),
              has_tokens = countIf(isNotNull(gen_ai.usage.input_tokens) or isNotNull(gen_ai.usage.output_tokens)),
              has_agents = countIf(isNotNull(gen_ai.agent.name)),
              has_tools = countIf(gen_ai.operation.name == "execute_tool"),
              has_conversation = countIf(isNotNull(gen_ai.conversation.id)),
              total = count()
        means: >-
          One row of counts. has_genai = 0 means no instrumented LLM calls; a
          family at 0 while has_genai > 0 means the instrumentation does not
          record that signal, not that it did not happen.
        emptyMeans: >-
          No spans at all in the window and scope: the scope is wrong, or no
          tracing data is ingested.

    - metadata:
        name: genai-agent-errors
        version: 1
        tags: [genai, agents, errors, triage]
      spec:
        summary: Which GenAI agents fail most often
        requires: [genai]
        timeframe: 24h
        scope: [cluster, namespace, tag]
        dql: |
          fetch spans
          | filter isNotNull(gen_ai.agent.name)
          {{- with .scope.stage}}
          {{.}}{{end}}
          | summarize total = count(), errors = countIf(span.status_code == "error"),
              by: {gen_ai.agent.name}
          | fieldsAdd error_rate_pct = if(total > 0, errors * 100.0 / total, else: 0.0)
          | sort errors desc
        means: >-
          Error count and rate per agent, from agent spans with an error status.
        emptyMeans: >-
          No span names an agent. The application may call models without an
          agent framework, or the instrumentation does not set gen_ai.agent.name.
        next:
          - recipe: genai-presence
            when: empty

    - metadata:
        name: genai-failed-evaluations
        version: 1
        tags: [genai, evaluations, quality]
      spec:
        summary: Recent LLM-judge evaluations that failed
        requires: [genai-evaluations]
        timeframe: 24h
        dql: |
          fetch bizevents
          | filter event.type == "gen_ai.evaluation.result"
          | filter gen_ai.evaluation.score.label == "fail"
          | fields timestamp, gen_ai.evaluation.name, gen_ai.evaluation.score.value,
              gen_ai.evaluation.explanation
          | sort timestamp desc
          | limit 50
        means: >-
          Each row is one evaluator verdict of "fail", with the judge's
          explanation. Evaluations are bizevents, not spans.
        emptyMeans: >-
          No failed evaluation in the window. If no evaluation results exist at
          all, evaluations are not configured; check with a wider --from.
